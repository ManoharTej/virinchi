<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#06060a"/>
  <!-- Frequency glow and equalizer bars -->
  <defs>
    <linearGradient id="virGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="60%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- V-Equalizer Crest -->
  <path d="M12 18 L24 46 L32 28 L40 46 L52 18" stroke="url(#virGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  <!-- Equalizer soundbars -->
  <line x1="20" y1="28" x2="20" y2="38" stroke="#ff2d55" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="22" x2="26" y2="40" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="14" x2="32" y2="44" stroke="#ff3b69" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)"/>
  <line x1="38" y1="22" x2="38" y2="40" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="28" x2="44" y2="38" stroke="#ff2d55" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="12" r="2.5" fill="#f43f5e" filter="url(#neonGlow)"/>
</svg>